[pytest]
addopts = --alluredir=reports/allure-results -W ignore::pytest.PytestUnknownMarkWarning
testpaths = src/tests
markers =
    smoke: Basic tests verifying the most critical functionality
    regression: Tests ensuring previous functionality remains unchanged
    positive: Tests expected to pass under normal conditions
    negative: Tests designed to validate error handling
    exploratory: Tests generated during live app exploration, pending review
